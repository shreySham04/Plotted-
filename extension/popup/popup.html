<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Plotted - Film Taste Recommender</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo">
      <span class="logo-icon">🎬</span>
      <span class="logo-text">PLOTTED</span>
    </div>
    <div class="header-actions">
      <span class="status-badge live">● Active Monitor</span>
      <button id="toggle-settings" class="icon-btn" title="API Settings">⚙️</button>
    </div>
  </div>

  <!-- Collapsible Settings & Sync Drawer -->
  <div id="settings-drawer" class="settings-drawer hidden">
    <div class="settings-title">SYNC & API CONFIGURATION</div>
    <div class="input-group">
      <label for="api-url-input">Backend API URL:</label>
      <input type="text" id="api-url-input" placeholder="http://localhost:3000" />
    </div>
    <div class="settings-buttons">
      <button id="save-api-url" class="btn small">Save</button>
      <button id="sync-now-btn" class="btn small primary">Sync Now</button>
    </div>
    <div id="sync-status" class="sync-status">Ready</div>
  </div>

  <div class="taste-card">
    <div class="archetype-label">YOUR TASTE ARCHETYPE</div>
    <div id="archetype-name" class="archetype-title">The Existential Puzzle-Solver</div>
    <div id="archetype-desc" class="archetype-desc">Capturing YouTube Shorts, video essays, searches, and streaming player sessions.</div>
  </div>

  <div class="stats-row">
    <div class="stat-box">
      <div id="shorts-count" class="stat-num">0</div>
      <div class="stat-label">Shorts</div>
    </div>
    <div class="stat-box">
      <div id="yt-count" class="stat-num">0</div>
      <div class="stat-label">YouTube</div>
    </div>
    <div class="stat-box">
      <div id="search-count" class="stat-num">0</div>
      <div class="stat-label">Searches</div>
    </div>
    <div class="stat-box accent">
      <div id="stream-count" class="stat-num">0</div>
      <div class="stat-label">Streams</div>
    </div>
  </div>

  <div class="section-title">TOP MATCH RECOMMENDATION</div>
  <div id="recs-container" class="recs-list">
    <!-- Populated safely via DOM APIs -->
  </div>

  <div class="footer">
    <button id="open-dashboard" class="btn primary">Open Full Plotted Companion</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
